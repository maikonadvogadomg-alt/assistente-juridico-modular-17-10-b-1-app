name: "📱 Gerar APK (Android)"
# Monta o APK do Assistente Jurídico com o Capacitor, sem precisar de nada no seu PC.
# Como usar: GitHub → aba Actions → "📱 Gerar APK (Android)" → Run workflow.
# No fim: aba "Releases" (apk-N) ou o artefato "Assistente-Juridico-APK".
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Separar o site (só o que vai dentro do app)
        run: |
          mkdir -p apk/www
          cp -r index.html manifest.json sw.js css js lib icons ferramentas apk/www/
          cp capacitor.config.json apk/
      - name: Instalar o Capacitor
        working-directory: apk
        run: |
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - name: Criar o projeto Android
        working-directory: apk
        run: |
          npx cap add android
          # microfone (ditado por voz) e internet
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Montar o APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../../saida
          cp app/build/outputs/apk/debug/app-debug.apk ../../saida/Assistente-Juridico.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Assistente-Juridico-APK
          path: saida/*.apk
          retention-days: 30
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "📱 APK ${{ github.run_number }}"
          files: saida/*.apk
